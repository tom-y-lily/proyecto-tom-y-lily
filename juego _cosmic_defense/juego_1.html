<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Cosmic Defender</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: linear-gradient(180deg, #0a0a2e 0%, #1a0a3e 50%, #0a0a2e 100%);
            border: 3px solid #00d4ff;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.3), inset 0 0 60px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            transition: opacity 0.5s;
        }

        .ui-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .title {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: 900;
            color: #00d4ff;
            text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
            margin-bottom: 10px;
            animation: pulse 2s infinite;
        }

        .subtitle {
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            color: #ff6b9d;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #ff6b9d;
        }

        .btn {
            padding: 15px 50px;
            margin: 10px;
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            border: 2px solid #00d4ff;
            background: transparent;
            color: #00d4ff;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: #00d4ff;
            color: #0a0a1a;
            box-shadow: 0 0 30px #00d4ff;
            transform: scale(1.05);
        }

        .btn-back {
            border-color: #ff6b9d;
            color: #ff6b9d;
            font-size: 0.9rem;
            padding: 10px 30px;
        }

        .btn-back:hover {
            background: #ff6b9d;
            color: #0a0a1a;
            box-shadow: 0 0 20px #ff6b9d;
        }

        .hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 5;
            pointer-events: none;
        }

        .hud-item {
            font-size: 1rem;
            color: #00d4ff;
            text-shadow: 0 0 10px #00d4ff;
        }

        .hud-item span {
            color: #fff;
        }

        .health-bar {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ffaa00, #00ff88);
            transition: width 0.3s;
            border-radius: 4px;
        }

        .controls-hint {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        .final-score {
            font-size: 2rem;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
            margin: 15px 0;
        }

        .stars-bg {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        .level-up {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: #ffd700;
            text-shadow: 0 0 30px #ffd700;
            pointer-events: none;
            opacity: 0;
            z-index: 8;
        }

        .level-up.show {
            animation: levelUpAnim 1.5s ease-out;
        }

        @keyframes levelUpAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }

            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }

            80% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1);
            }
        }
    </style>
</head>

<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div class="hud" id="hud" style="display:none;">
            <div class="hud-item">PUNTUACIÓN: <span id="scoreDisplay">0</span></div>
            <div class="hud-item">NIVEL: <span id="levelDisplay">1</span></div>
            <div class="hud-item">MEJOR: <span id="highScoreDisplay">0</span></div>
        </div>

        <div class="health-bar" id="healthBar" style="display:none;">
            <div class="health-fill" id="healthFill" style="width: 100%;"></div>
        </div>

        <div class="controls-hint" id="controlsHint" style="display:none;">
            WASD / FLECHAS para mover • ESPACIO para disparar
        </div>

        <div class="level-up" id="levelUpText">¡NIVEL SUPERADO!</div>

        <!-- Pantalla de inicio -->
        <div class="ui-overlay" id="startScreen">
            <div class="title">🚀 COSMIC DEFENDER</div>
            <div class="subtitle">Defiende la galaxia de los meteoritos</div>
            <button class="btn" onclick="startGame()">JUGAR</button>
            <button class="btn btn-back" onclick="goBack()">← VOLVER A JUEGOS</button>
        </div>

        <!-- Pantalla de Game Over -->
        <div class="ui-overlay hidden" id="gameOverScreen">
            <div class="title" style="color: #ff4444; text-shadow: 0 0 20px #ff4444;">GAME OVER</div>
            <div class="final-score">Puntuación: <span id="finalScore">0</span></div>
            <div style="color: #aaa; margin-bottom: 20px;">Nivel alcanzado: <span id="finalLevel">1</span></div>
            <button class="btn" onclick="startGame()">REINTENTAR</button>
            <button class="btn btn-back" onclick="goBack()">← VOLVER A JUEGOS</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Ajustar tamaño del canvas
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Estado del juego
        let gameRunning = false;
        let score = 0;
        let level = 1;
        let highScore = localStorage.getItem('cosmicHighScore') || 0;
        let health = 100;
        let frameCount = 0;

        // Jugador
        const player = {
            x: 0, y: 0,
            width: 40, height: 50,
            speed: 6,
            dx: 0, dy: 0,
            cooldown: 0,
            invulnerable: 0
        };

        // Entidades
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let powerUps = [];

        // Controles
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) {
                e.preventDefault();
            }
        });
        document.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // Audio sintetizado
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, now);
                osc.frequency.exponentialRampToValueAtTime(220, now + 0.1);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'explosion') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'levelUp') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554, now + 0.1);
                osc.frequency.setValueAtTime(659, now + 0.2);
                osc.frequency.setValueAtTime(880, now + 0.3);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // Inicializar estrellas de fondo
        function initStars() {
            stars = [];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 1 + 0.2,
                    brightness: Math.random()
                });
            }
        }

        // Crear partículas de explosión
        function createExplosion(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                const speed = Math.random() * 4 + 1;
                particles.push({
                    x, y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.03 + 0.01,
                    color,
                    size: Math.random() * 4 + 2
                });
            }
        }

        // Crear enemigo
        function spawnEnemy() {
            const size = Math.random() * 20 + 15;
            const side = Math.floor(Math.random() * 3); // 0: top, 1: left, 2: right

            let x, y, dx, dy;
            const speed = 1 + level * 0.3 + Math.random();

            if (side === 0) {
                x = Math.random() * canvas.width;
                y = -size;
                dx = (Math.random() - 0.5) * 2;
                dy = speed;
            } else if (side === 1) {
                x = -size;
                y = Math.random() * canvas.height * 0.5;
                dx = speed;
                dy = Math.random() * 1;
            } else {
                x = canvas.width + size;
                y = Math.random() * canvas.height * 0.5;
                dx = -speed;
                dy = Math.random() * 1;
            }

            enemies.push({
                x, y, dx, dy,
                size,
                health: Math.floor(size / 10) + 1,
                rotation: 0,
                rotSpeed: (Math.random() - 0.5) * 0.1,
                type: Math.random() > 0.8 ? 'fast' : 'normal'
            });
        }

        // Dibujar jugador
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);

            // Efecto de invulnerabilidad
            if (player.invulnerable > 0 && Math.floor(player.invulnerable / 5) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            // Sombra de motor
            ctx.fillStyle = `rgba(0, 212, 255, ${0.3 + Math.random() * 0.3})`;
            ctx.beginPath();
            ctx.moveTo(-8, 20);
            ctx.lineTo(0, 35 + Math.random() * 10);
            ctx.lineTo(8, 20);
            ctx.fill();

            // Nave
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(-15, 20);
            ctx.lineTo(-8, 15);
            ctx.lineTo(0, 25);
            ctx.lineTo(8, 15);
            ctx.lineTo(15, 20);
            ctx.closePath();
            ctx.fill();

            // Detalles
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, -5, 4, 0, Math.PI * 2);
            ctx.fill();

            // Alas
            ctx.fillStyle = '#0088aa';
            ctx.beginPath();
            ctx.moveTo(-15, 5);
            ctx.lineTo(-25, 20);
            ctx.lineTo(-15, 15);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(15, 5);
            ctx.lineTo(25, 20);
            ctx.lineTo(15, 15);
            ctx.fill();

            ctx.restore();
        }

        // Dibujar enemigo
        function drawEnemy(enemy) {
            ctx.save();
            ctx.translate(enemy.x, enemy.y);
            ctx.rotate(enemy.rotation);

            if (enemy.type === 'fast') {
                ctx.fillStyle = '#ff6b9d';
                ctx.shadowColor = '#ff6b9d';
            } else {
                ctx.fillStyle = '#ff8844';
                ctx.shadowColor = '#ff8844';
            }
            ctx.shadowBlur = 10;

            // Meteorito con forma irregular
            ctx.beginPath();
            const points = 8;
            for (let i = 0; i < points; i++) {
                const angle = (Math.PI * 2 / points) * i;
                const r = enemy.size * (0.8 + Math.random() * 0.4);
                const x = Math.cos(angle) * r;
                const y = Math.sin(angle) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();

            // Cráteres
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.arc(enemy.size * 0.3, -enemy.size * 0.2, enemy.size * 0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Dibujar bala
        function drawBullet(bullet) {
            ctx.save();
            ctx.fillStyle = '#00ff88';
            ctx.shadowColor = '#00ff88';
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
            ctx.fill();

            // Estela
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(bullet.x, bullet.y + 10);
            ctx.lineTo(bullet.x, bullet.y + 25);
            ctx.stroke();

            ctx.restore();
        }

        // Dibujar partícula
        function drawParticle(p) {
            ctx.save();
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 5;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Dibujar estrellas
        function drawStars() {
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.brightness})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Colisiones
        function checkCollision(a, b, radiusA, radiusB) {
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            return Math.sqrt(dx * dx + dy * dy) < radiusA + radiusB;
        }

        // Actualizar juego
        function update() {
            if (!gameRunning) return;

            frameCount++;

            // Movimiento del jugador
            player.dx = 0;
            player.dy = 0;
            if (keys['arrowleft'] || keys['a']) player.dx = -player.speed;
            if (keys['arrowright'] || keys['d']) player.dx = player.speed;
            if (keys['arrowup'] || keys['w']) player.dy = -player.speed;
            if (keys['arrowdown'] || keys['s']) player.dy = player.speed;

            player.x += player.dx;
            player.y += player.dy;

            // Limitar a pantalla
            player.x = Math.max(20, Math.min(canvas.width - 20, player.x));
            player.y = Math.max(20, Math.min(canvas.height - 20, player.y));

            // Disparar
            if (player.cooldown > 0) player.cooldown--;
            if ((keys[' '] || keys['enter']) && player.cooldown <= 0) {
                bullets.push({
                    x: player.x,
                    y: player.y - 25,
                    dy: -10
                });
                bullets.push({
                    x: player.x - 12,
                    y: player.y - 10,
                    dy: -10
                });
                bullets.push({
                    x: player.x + 12,
                    y: player.y - 10,
                    dy: -10
                });
                player.cooldown = 12;
                playSound('shoot');
            }

            // Invulnerabilidad
            if (player.invulnerable > 0) player.invulnerable--;

            // Actualizar balas
            bullets = bullets.filter(b => {
                b.y += b.dy;
                return b.y > -10;
            });

            // Spawn enemigos
            const spawnRate = Math.max(20, 60 - level * 5);
            if (frameCount % spawnRate === 0) {
                spawnEnemy();
            }

            // Actualizar enemigos
            enemies = enemies.filter(enemy => {
                enemy.x += enemy.dx;
                enemy.y += enemy.dy;
                enemy.rotation += enemy.rotSpeed;

                // Colisión con jugador
                if (player.invulnerable <= 0 && checkCollision(player, enemy, 15, enemy.size)) {
                    health -= 20;
                    player.invulnerable = 60;
                    createExplosion(enemy.x, enemy.y, '#ff4444', 20);
                    playSound('hit');

                    if (health <= 0) {
                        gameOver();
                    }
                    return false;
                }

                // Colisión con balas
                for (let i = bullets.length - 1; i >= 0; i--) {
                    if (checkCollision(bullets[i], enemy, 5, enemy.size)) {
                        enemy.health--;
                        bullets.splice(i, 1);
                        createExplosion(bullets[i]?.x || enemy.x, bullets[i]?.y || enemy.y, '#00ff88', 5);

                        if (enemy.health <= 0) {
                            createExplosion(enemy.x, enemy.y, '#ff8844', 25);
                            playSound('explosion');
                            score += enemy.type === 'fast' ? 30 : 10;

                            // Subir de nivel cada 100 puntos
                            if (score > 0 && score % 100 === 0) {
                                level++;
                                playSound('levelUp');
                                showLevelUp();
                            }

                            return false;
                        }
                        break;
                    }
                }

                return enemy.y < canvas.height + 50 && enemy.x > -50 && enemy.x < canvas.width + 50;
            });

            // Actualizar partículas
            particles = particles.filter(p => {
                p.x += p.dx;
                p.y += p.dy;
                p.life -= p.decay;
                return p.life > 0;
            });

            // Actualizar estrellas
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Actualizar HUD
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('levelDisplay').textContent = level;
            document.getElementById('healthFill').style.width = health + '%';
        }

        // Dibujar todo
        function draw() {
            ctx.fillStyle = 'rgba(10, 10, 46, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawStars();

            if (gameRunning) {
                bullets.forEach(drawBullet);
                enemies.forEach(drawEnemy);
                drawPlayer();
            }

            particles.forEach(drawParticle);
        }

        // Mostrar subida de nivel
        function showLevelUp() {
            const el = document.getElementById('levelUpText');
            el.textContent = `¡NIVEL ${level}!`;
            el.classList.remove('show');
            void el.offsetWidth; // trigger reflow
            el.classList.add('show');
        }

        // Bucle principal
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Iniciar juego
        function startGame() {
            gameRunning = true;
            score = 0;
            level = 1;
            health = 100;
            bullets = [];
            enemies = [];
            particles = [];

            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.invulnerable = 0;

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('healthBar').style.display = 'block';
            document.getElementById('controlsHint').style.display = 'block';
            document.getElementById('highScoreDisplay').textContent = highScore;

            initStars();

            // Iniciar audio context en interacción
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Game Over
        function gameOver() {
            gameRunning = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cosmicHighScore', highScore);
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('hud').style.display = 'none';
            document.getElementById('healthBar').style.display = 'none';
            document.getElementById('controlsHint').style.display = 'none';
        }

        // Volver a juegos.html
        function goBack() {
            window.location.href = '../Juegos.html';
        }

        // Iniciar
        initStars();
        gameLoop();

        // Posición inicial del jugador
        player.x = canvas.width / 2;
        player.y = canvas.height - 80;
    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Neon Snake Arena</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050505;
            overflow: hidden;
            font-family: 'Orbitron', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }

        #gameContainer {
            position: relative;
            width: 95vw;
            max-width: 700px;
            aspect-ratio: 1;
            background: radial-gradient(ellipse at center, #0a0a1a 0%, #000000 100%);
            border: 3px solid #00ff88;
            border-radius: 16px;
            box-shadow:
                0 0 30px rgba(0, 255, 136, 0.2),
                inset 0 0 60px rgba(0, 255, 136, 0.05);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD */
        .hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.7) 0%, transparent 100%);
        }

        .hud-item {
            font-size: 0.85rem;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-item .value {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            color: #fff;
        }

        .combo-bar {
            position: absolute;
            top: 45px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            z-index: 5;
            pointer-events: none;
        }

        .combo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
            border: 1px solid #555;
            transition: all 0.3s;
        }

        .combo-dot.active {
            background: #ffd700;
            box-shadow: 0 0 10px #ffd700;
            border-color: #ffd700;
        }

        /* Pantallas overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.88);
            z-index: 20;
            transition: opacity 0.5s;
            backdrop-filter: blur(5px);
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.8rem);
            font-weight: 900;
            color: #00ff88;
            text-shadow:
                0 0 10px #00ff88,
                0 0 30px #00ff88,
                0 0 60px rgba(0, 255, 136, 0.5);
            margin-bottom: 8px;
            animation: titlePulse 2s ease-in-out infinite;
            text-align: center;
        }

        .game-subtitle {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 30px;
            letter-spacing: 3px;
        }

        .btn {
            padding: 14px 45px;
            margin: 8px;
            font-family: 'Orbitron', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            border: 2px solid #00ff88;
            background: transparent;
            color: #00ff88;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.25s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 30px #00ff88;
            transform: translateY(-2px);
        }

        .btn-back {
            border-color: #ff6b9d;
            color: #ff6b9d;
            font-size: 0.75rem;
            padding: 10px 30px;
            margin-top: 15px;
        }

        .btn-back:hover {
            background: #ff6b9d;
            box-shadow: 0 0 20px #ff6b9d;
        }

        .btn-mode {
            border-color: #ffaa00;
            color: #ffaa00;
            font-size: 0.8rem;
            padding: 10px 25px;
        }

        .btn-mode:hover {
            background: #ffaa00;
            box-shadow: 0 0 20px #ffaa00;
        }

        .btn-mode.selected {
            background: #ffaa00;
            color: #000;
            box-shadow: 0 0 15px #ffaa00;
        }

        .final-score-box {
            text-align: center;
            margin: 15px 0 25px;
        }

        .final-score-label {
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .final-score-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.8rem;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700;
        }

        .stats-row {
            display: flex;
            gap: 30px;
            margin-bottom: 25px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.6rem;
            color: #666;
            letter-spacing: 2px;
        }

        .stat-value {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            color: #00ff88;
            margin-top: 4px;
        }

        .controls-hint {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            z-index: 5;
            pointer-events: none;
            letter-spacing: 1px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .powerup-indicator {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 5;
            pointer-events: none;
        }

        .powerup-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            border: 2px solid;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s;
        }

        .powerup-icon.active {
            opacity: 1;
            transform: scale(1);
            animation: powerupPulse 1s ease-in-out infinite;
        }

        @keyframes titlePulse {

            0%,
            100% {
                transform: scale(1);
                text-shadow: 0 0 10px #00ff88, 0 0 30px #00ff88;
            }

            50% {
                transform: scale(1.03);
                text-shadow: 0 0 20px #00ff88, 0 0 50px #00ff88, 0 0 80px rgba(0, 255, 136, 0.3);
            }
        }

        @keyframes powerupPulse {

            0%,
            100% {
                box-shadow: 0 0 5px currentColor;
            }

            50% {
                box-shadow: 0 0 15px currentColor, 0 0 30px currentColor;
            }
        }

        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            text-align: center;
        }

        .notification.show {
            animation: notifAnim 1.5s ease-out forwards;
        }

        @keyframes notifAnim {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }

            15% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.1);
            }

            30% {
                transform: translate(-50%, -50%) scale(1);
            }

            70% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform: translate(-50%, -80%) scale(0.9);
            }
        }

        /* Responsive */
        @media (max-width: 500px) {
            .hud-item {
                font-size: 0.7rem;
            }

            .hud-item .value {
                font-size: 0.6rem;
            }

            .controls-hint {
                font-size: 0.55rem;
            }
        }
    </style>
</head>

<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div class="hud" id="hud" style="display:none;">
            <div class="hud-item">⚡ SCORE <span class="value" id="scoreDisplay">0</span></div>
            <div class="hud-item">🏆 BEST <span class="value" id="bestDisplay">0</span></div>
            <div class="hud-item">🍎 <span class="value" id="lengthDisplay">3</span></div>
        </div>

        <div class="combo-bar" id="comboBar" style="display:none;"></div>

        <div class="powerup-indicator" id="powerupIndicator" style="display:none;">
            <div class="powerup-icon" id="iconSpeed" style="border-color:#00d4ff;color:#00d4ff;">⚡</div>
            <div class="powerup-icon" id="iconGhost" style="border-color:#aa66ff;color:#aa66ff;">👻</div>
            <div class="powerup-icon" id="iconMagnet" style="border-color:#ffaa00;color:#ffaa00;">🧲</div>
        </div>

        <div class="controls-hint" id="controlsHint" style="display:none;">
            FLECHAS o WASD para mover • P para pausar
        </div>

        <div class="notification" id="notification"></div>

        <!-- Pantalla de inicio -->
        <div class="overlay" id="startScreen">
            <div class="game-title">⚡ NEON SNAKE<br>ARENA</div>
            <div class="game-subtitle">EL CLÁSICO, REINVENTADO</div>

            <div class="mode-selector">
                <button class="btn btn-mode selected" id="btnClassic" onclick="selectMode('classic')">CLÁSICO</button>
                <button class="btn btn-mode" id="btnSurvival" onclick="selectMode('survival')">SUPERVIVENCIA</button>
            </div>

            <button class="btn" onclick="startGame()">JUGAR</button>
            <button class="btn btn-back" onclick="window.location.href='../Juegos.html'">← VOLVER A JUEGOS</button>
        </div>

        <!-- Pantalla de Game Over -->
        <div class="overlay hidden" id="gameOverScreen">
            <div class="game-title" style="color:#ff4444;text-shadow:0 0 20px #ff4444,0 0 40px #ff4444;">GAME OVER</div>

            <div class="final-score-box">
                <div class="final-score-label">PUNTUACIÓN FINAL</div>
                <div class="final-score-value" id="finalScore">0</div>
            </div>

            <div class="stats-row">
                <div class="stat">
                    <div class="stat-label">LONGITUD</div>
                    <div class="stat-value" id="finalLength">3</div>
                </div>
                <div class="stat">
                    <div class="stat-label">COMBO MAX</div>
                    <div class="stat-value" id="finalCombo">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">TIEMPO</div>
                    <div class="stat-value" id="finalTime">0s</div>
                </div>
            </div>

            <button class="btn" onclick="startGame()">REINTENTAR</button>
            <button class="btn btn-back" onclick="window.location.href='../Juegos.html'">← VOLVER A JUEGOS</button>
        </div>

        <!-- Pantalla de pausa -->
        <div class="overlay hidden" id="pauseScreen">
            <div class="game-title" style="font-size:2rem;">PAUSA</div>
            <button class="btn" onclick="resumeGame()">CONTINUAR</button>
            <button class="btn btn-back" onclick="goToMenu()">MENÚ PRINCIPAL</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Configuración de grid
        const GRID_SIZE = 20;
        let CELL_SIZE;
        let COLS, ROWS;

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            CELL_SIZE = Math.floor(canvas.width / GRID_SIZE);
            COLS = GRID_SIZE;
            ROWS = Math.floor(canvas.height / CELL_SIZE);
        }
        resizeCanvas();
        window.addEventListener('resize', () => {
            resizeCanvas();
            if (gameState === 'playing') {
                // Ajustar posiciones si es necesario
                snake = snake.map(s => ({
                    x: Math.min(s.x, COLS - 1),
                    y: Math.min(s.y, ROWS - 1)
                }));
            }
        });

        // Estado del juego
        let gameState = 'menu'; // menu, playing, paused, gameover
        let gameMode = 'classic'; // classic, survival
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('snakeBestScore')) || 0;
        let startTime = 0;
        let gameTime = 0;
        let combo = 0;
        let maxCombo = 0;
        let comboTimer = null;

        // Snake
        let snake = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let moveTimer = 0;
        let baseSpeed = 8; // movimientos por segundo
        let currentSpeed = baseSpeed;

        // Comida
        let food = null;
        let foodType = 'normal'; // normal, golden, poison
        let foodPulse = 0;

        // Power-ups
        let powerUp = null;
        let activePowerUps = {
            speed: 0,    // duración en frames
            ghost: 0,
            magnet: 0
        };

        // Obstáculos (modo supervivencia)
        let obstacles = [];
        let obstacleTimer = 0;

        // Partículas
        let particles = [];
        let floatingTexts = [];

        // Grid de efectos visuales
        let gridEffects = [];

        // Audio
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch (type) {
                case 'eat':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.05);
                    osc.frequency.setValueAtTime(784, now + 0.1);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'eatGolden':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.05);
                    osc.frequency.setValueAtTime(784, now + 0.1);
                    osc.frequency.setValueAtTime(1047, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                    break;
                case 'die':
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 'powerup':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(554, now + 0.1);
                    osc.frequency.setValueAtTime(659, now + 0.2);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'combo':
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(1760, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'obstacle':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
            }
        }

        // Controles
        const keys = {};
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;

            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) {
                e.preventDefault();
            }

            if (gameState === 'playing') {
                if (key === 'arrowup' || key === 'w') {
                    if (direction.y === 0) nextDirection = { x: 0, y: -1 };
                } else if (key === 'arrowdown' || key === 's') {
                    if (direction.y === 0) nextDirection = { x: 0, y: 1 };
                } else if (key === 'arrowleft' || key === 'a') {
                    if (direction.x === 0) nextDirection = { x: -1, y: 0 };
                } else if (key === 'arrowright' || key === 'd') {
                    if (direction.x === 0) nextDirection = { x: 1, y: 0 };
                } else if (key === 'p') {
                    pauseGame();
                }
            }
        });

        // Seleccionar modo
        function selectMode(mode) {
            gameMode = mode;
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('selected'));
            document.getElementById(mode === 'classic' ? 'btnClassic' : 'btnSurvival').classList.add('selected');
        }

        // Inicializar combo bar
        function initComboBar() {
            const bar = document.getElementById('comboBar');
            bar.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const dot = document.createElement('div');
                dot.className = 'combo-dot';
                bar.appendChild(dot);
            }
        }

        // Mostrar notificación
        function showNotification(text, color = '#00ff88') {
            const el = document.getElementById('notification');
            el.textContent = text;
            el.style.color = color;
            el.style.textShadow = `0 0 20px ${color}`;
            el.classList.remove('show');
            void el.offsetWidth;
            el.classList.add('show');
        }

        // Spawn comida
        function spawnFood() {
            let attempts = 0;
            do {
                food = {
                    x: Math.floor(Math.random() * (COLS - 2)) + 1,
                    y: Math.floor(Math.random() * (ROWS - 2)) + 1
                };
                attempts++;
            } while (isOccupied(food.x, food.y) && attempts < 100);

            const rand = Math.random();
            if (rand < 0.05) foodType = 'golden';
            else if (rand < 0.15 && gameMode === 'survival') foodType = 'poison';
            else foodType = 'normal';
        }

        // Spawn power-up
        function spawnPowerUp() {
            if (powerUp || Math.random() > 0.3) return;
            let attempts = 0;
            do {
                powerUp = {
                    x: Math.floor(Math.random() * (COLS - 2)) + 1,
                    y: Math.floor(Math.random() * (ROWS - 2)) + 1,
                    type: ['speed', 'ghost', 'magnet'][Math.floor(Math.random() * 3)]
                };
                attempts++;
            } while (isOccupied(powerUp.x, powerUp.y) && attempts < 100);
        }

        // Spawn obstáculo (supervivencia)
        function spawnObstacle() {
            if (gameMode !== 'survival') return;
            let attempts = 0;
            let obs;
            do {
                obs = {
                    x: Math.floor(Math.random() * (COLS - 2)) + 1,
                    y: Math.floor(Math.random() * (ROWS - 2)) + 1
                };
                attempts++;
            } while ((isOccupied(obs.x, obs.y) || (Math.abs(obs.x - snake[0].x) < 5 && Math.abs(obs.y - snake[0].y) < 5)) && attempts < 100);

            if (attempts < 100) {
                obstacles.push(obs);
                playSound('obstacle');
                createParticles(obs.x * CELL_SIZE + CELL_SIZE / 2, obs.y * CELL_SIZE + CELL_SIZE / 2, '#ff4444', 8);
            }
        }

        function isOccupied(x, y) {
            return snake.some(s => s.x === x && s.y === y) ||
                obstacles.some(o => o.x === x && o.y === y) ||
                (powerUp && powerUp.x === x && powerUp.y === y);
        }

        // Crear partículas
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i + Math.random() * 0.5;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x, y,
                    dx: Math.cos(angle) * speed,
                    dy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.04 + 0.02,
                    color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        // Texto flotante
        function addFloatingText(x, y, text, color) {
            floatingTexts.push({
                x, y, text, color,
                life: 1,
                dy: -1.5
            });
        }

        // Efecto de grid
        function addGridEffect(x, y, color) {
            gridEffects.push({
                x, y, color,
                life: 1,
                maxLife: 20
            });
        }

        // Iniciar juego
        function startGame() {
            gameState = 'playing';
            score = 0;
            combo = 0;
            maxCombo = 0;
            gameTime = 0;
            startTime = Date.now();

            snake = [
                { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) },
                { x: Math.floor(COLS / 2) - 1, y: Math.floor(ROWS / 2) },
                { x: Math.floor(COLS / 2) - 2, y: Math.floor(ROWS / 2) }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };

            obstacles = [];
            particles = [];
            floatingTexts = [];
            gridEffects = [];
            powerUp = null;
            activePowerUps = { speed: 0, ghost: 0, magnet: 0 };
            currentSpeed = baseSpeed;

            // Modo supervivencia: obstáculos iniciales
            if (gameMode === 'survival') {
                for (let i = 0; i < 5; i++) spawnObstacle();
            }

            spawnFood();
            initComboBar();

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'flex';
            document.getElementById('comboBar').style.display = 'flex';
            document.getElementById('powerupIndicator').style.display = 'flex';
            document.getElementById('controlsHint').style.display = 'block';
            document.getElementById('bestDisplay').textContent = bestScore;

            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        // Pausar
        function pauseGame() {
            if (gameState !== 'playing') return;
            gameState = 'paused';
            document.getElementById('pauseScreen').classList.remove('hidden');
        }

        // Reanudar
        function resumeGame() {
            gameState = 'playing';
            document.getElementById('pauseScreen').classList.add('hidden');
            startTime = Date.now() - gameTime * 1000;
        }

        // Ir al menú
        function goToMenu() {
            gameState = 'menu';
            document.getElementById('pauseScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            document.getElementById('hud').style.display = 'none';
            document.getElementById('comboBar').style.display = 'none';
            document.getElementById('powerupIndicator').style.display = 'none';
            document.getElementById('controlsHint').style.display = 'none';
        }

        // Game Over
        function gameOver() {
            gameState = 'gameover';
            playSound('die');

            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('snakeBestScore', bestScore);
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLength').textContent = snake.length;
            document.getElementById('finalCombo').textContent = maxCombo;
            document.getElementById('finalTime').textContent = Math.floor(gameTime) + 's';

            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('hud').style.display = 'none';
            document.getElementById('comboBar').style.display = 'none';
            document.getElementById('powerupIndicator').style.display = 'none';
            document.getElementById('controlsHint').style.display = 'none';
        }

        // Volver a juegos
        function goBack() {
            window.location.href = 'juegos.html';
        }

        // Actualizar power-up indicators
        function updatePowerUpIndicators() {
            document.getElementById('iconSpeed').classList.toggle('active', activePowerUps.speed > 0);
            document.getElementById('iconGhost').classList.toggle('active', activePowerUps.ghost > 0);
            document.getElementById('iconMagnet').classList.toggle('active', activePowerUps.magnet > 0);
        }

        // Actualizar combo visual
        function updateComboBar() {
            const dots = document.querySelectorAll('.combo-dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i < combo);
            });
        }

        // Lógica principal
        let lastTime = 0;
        function update(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            if (gameState !== 'playing') {
                requestAnimationFrame(update);
                return;
            }

            gameTime = (Date.now() - startTime) / 1000;

            // Actualizar power-ups
            Object.keys(activePowerUps).forEach(key => {
                if (activePowerUps[key] > 0) activePowerUps[key]--;
            });
            updatePowerUpIndicators();

            // Velocidad según power-up
            currentSpeed = activePowerUps.speed > 0 ? baseSpeed * 1.8 : baseSpeed;

            // Movimiento de la serpiente
            moveTimer += deltaTime;
            const moveInterval = 1000 / currentSpeed;

            if (moveTimer >= moveInterval) {
                moveTimer = 0;
                direction = { ...nextDirection };

                const head = { ...snake[0] };
                head.x += direction.x;
                head.y += direction.y;

                // Colisión con paredes
                if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                    if (activePowerUps.ghost > 0) {
                        head.x = (head.x + COLS) % COLS;
                        head.y = (head.y + ROWS) % ROWS;
                    } else {
                        gameOver();
                        requestAnimationFrame(update);
                        return;
                    }
                }

                // Colisión con sí misma
                if (!activePowerUps.ghost > 0 && snake.some(s => s.x === head.x && s.y === head.y)) {
                    gameOver();
                    requestAnimationFrame(update);
                    return;
                }

                // Colisión con obstáculos
                if (obstacles.some(o => o.x === head.x && o.y === head.y)) {
                    gameOver();
                    requestAnimationFrame(update);
                    return;
                }

                snake.unshift(head);

                // Comer comida
                if (food && head.x === food.x && head.y === food.y) {
                    let points = 10;
                    let color = '#00ff88';

                    if (foodType === 'golden') {
                        points = 50;
                        color = '#ffd700';
                        playSound('eatGolden');
                        showNotification('¡DORADO! +50', '#ffd700');
                    } else if (foodType === 'poison') {
                        points = -20;
                        color = '#ff4444';
                        snake.pop();
                        snake.pop();
                        playSound('die');
                        showNotification('¡VENENO! -20', '#ff4444');
                        if (snake.length < 2) {
                            gameOver();
                            requestAnimationFrame(update);
                            return;
                        }
                    } else {
                        playSound('eat');
                        // Sistema de combo
                        combo++;
                        if (combo > maxCombo) maxCombo = combo;
                        if (combo >= 5) {
                            points = 20;
                            showNotification('¡COMBO x5! +20', '#ffaa00');
                            playSound('combo');
                            combo = 0;
                        }
                    }

                    score += points;
                    createParticles(head.x * CELL_SIZE + CELL_SIZE / 2, head.y * CELL_SIZE + CELL_SIZE / 2, color, 15);
                    addFloatingText(head.x * CELL_SIZE, head.y * CELL_SIZE, (points > 0 ? '+' : '') + points, color);
                    addGridEffect(head.x, head.y, color);
                    spawnFood();
                    spawnPowerUp();

                    // Modo supervivencia: más obstáculos con el tiempo
                    if (gameMode === 'survival') {
                        obstacleTimer++;
                        if (obstacleTimer % 5 === 0) spawnObstacle();
                        // Velocidad aumenta
                        baseSpeed = 8 + Math.floor(score / 50);
                    }
                } else {
                    snake.pop();
                    // Decaer combo
                    if (combo > 0 && !foodType !== 'poison') {
                        // combo se mantiene mientras sigas comiendo rápido
                    }
                }

                // Recoger power-up
                if (powerUp && head.x === powerUp.x && head.y === powerUp.y) {
                    activePowerUps[powerUp.type] = 300; // 5 segundos a 60fps
                    playSound('powerup');
                    const names = { speed: 'VELOCIDAD', ghost: 'FANTASMA', magnet: 'IMÁN' };
                    const colors = { speed: '#00d4ff', ghost: '#aa66ff', magnet: '#ffaa00' };
                    showNotification('¡' + names[powerUp.type] + '!', colors[powerUp.type]);
                    createParticles(powerUp.x * CELL_SIZE + CELL_SIZE / 2, powerUp.y * CELL_SIZE + CELL_SIZE / 2, colors[powerUp.type], 20);
                    powerUp = null;
                }

                updateComboBar();
            }

            // Actualizar partículas
            particles = particles.filter(p => {
                p.x += p.dx;
                p.y += p.dy;
                p.life -= p.decay;
                p.size *= 0.98;
                return p.life > 0;
            });

            // Actualizar textos flotantes
            floatingTexts = floatingTexts.filter(t => {
                t.y += t.dy;
                t.life -= 0.02;
                return t.life > 0;
            });

            // Actualizar efectos de grid
            gridEffects = gridEffects.filter(g => {
                g.life -= 1 / g.maxLife;
                return g.life > 0;
            });

            // Pulso de comida
            foodPulse += 0.08;

            // Spawn power-up ocasional
            if (Math.random() < 0.002) spawnPowerUp();

            // Actualizar HUD
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('lengthDisplay').textContent = snake.length;

            requestAnimationFrame(update);
        }

        // Dibujar
        function draw() {
            // Fondo
            ctx.fillStyle = 'rgba(5, 5, 10, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid sutil
            ctx.strokeStyle = 'rgba(0, 255, 136, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= COLS; x++) {
                ctx.beginPath();
                ctx.moveTo(x * CELL_SIZE, 0);
                ctx.lineTo(x * CELL_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y <= ROWS; y++) {
                ctx.beginPath();
                ctx.moveTo(0, y * CELL_SIZE);
                ctx.lineTo(canvas.width, y * CELL_SIZE);
                ctx.stroke();
            }

            if (gameState === 'playing' || gameState === 'paused') {
                // Efectos de grid
                gridEffects.forEach(g => {
                    const alpha = g.life * 0.3;
                    ctx.fillStyle = g.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba').replace('#', '');
                    // Convertir hex a rgba
                    const r = parseInt(g.color.slice(1, 3), 16);
                    const gr = parseInt(g.color.slice(3, 5), 16);
                    const b = parseInt(g.color.slice(5, 7), 16);
                    ctx.fillStyle = `rgba(${r}, ${gr}, ${b}, ${alpha})`;
                    ctx.fillRect(g.x * CELL_SIZE, g.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                });

                // Obstáculos
                obstacles.forEach(obs => {
                    ctx.fillStyle = '#ff4444';
                    ctx.shadowColor = '#ff4444';
                    ctx.shadowBlur = 10;
                    const pad = 2;
                    ctx.fillRect(obs.x * CELL_SIZE + pad, obs.y * CELL_SIZE + pad, CELL_SIZE - pad * 2, CELL_SIZE - pad * 2);

                    // X en el obstáculo
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(obs.x * CELL_SIZE + 6, obs.y * CELL_SIZE + 6);
                    ctx.lineTo(obs.x * CELL_SIZE + CELL_SIZE - 6, obs.y * CELL_SIZE + CELL_SIZE - 6);
                    ctx.moveTo(obs.x * CELL_SIZE + CELL_SIZE - 6, obs.y * CELL_SIZE + 6);
                    ctx.lineTo(obs.x * CELL_SIZE + 6, obs.y * CELL_SIZE + CELL_SIZE - 6);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                });

                // Comida
                if (food) {
                    const pulse = Math.sin(foodPulse) * 3;
                    const cx = food.x * CELL_SIZE + CELL_SIZE / 2;
                    const cy = food.y * CELL_SIZE + CELL_SIZE / 2;

                    ctx.shadowBlur = 15 + pulse;

                    if (foodType === 'golden') {
                        ctx.fillStyle = '#ffd700';
                        ctx.shadowColor = '#ffd700';
                        // Estrella dorada
                        drawStar(cx, cy, 5, CELL_SIZE / 2 + pulse / 2, CELL_SIZE / 4 + pulse / 4);
                    } else if (foodType === 'poison') {
                        ctx.fillStyle = '#ff4444';
                        ctx.shadowColor = '#ff4444';
                        ctx.beginPath();
                        ctx.arc(cx, cy, CELL_SIZE / 3 + pulse / 3, 0, Math.PI * 2);
                        ctx.fill();
                        // Calavera simplificada
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(cx - 3, cy - 2, 2, 0, Math.PI * 2);
                        ctx.arc(cx + 3, cy - 2, 2, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = '#00ff88';
                        ctx.shadowColor = '#00ff88';
                        ctx.beginPath();
                        ctx.arc(cx, cy, CELL_SIZE / 3 + pulse / 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                // Power-up
                if (powerUp) {
                    const cx = powerUp.x * CELL_SIZE + CELL_SIZE / 2;
                    const cy = powerUp.y * CELL_SIZE + CELL_SIZE / 2;
                    const colors = { speed: '#00d4ff', ghost: '#aa66ff', magnet: '#ffaa00' };
                    const icons = { speed: '⚡', ghost: '👻', magnet: '🧲' };

                    ctx.fillStyle = colors[powerUp.type];
                    ctx.shadowColor = colors[powerUp.type];
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(cx, cy, CELL_SIZE / 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = '#000';
                    ctx.font = `${CELL_SIZE / 2}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(icons[powerUp.type], cx, cy);
                }

                // Snake
                snake.forEach((segment, i) => {
                    const x = segment.x * CELL_SIZE;
                    const y = segment.y * CELL_SIZE;
                    const isHead = i === 0;

                    // Glow
                    if (activePowerUps.ghost > 0) {
                        ctx.globalAlpha = 0.6 + Math.sin(frameCount * 0.2) * 0.2;
                    }

                    ctx.shadowColor = isHead ? '#00ff88' : '#00aa55';
                    ctx.shadowBlur = isHead ? 15 : 5;

                    // Cuerpo con gradiente
                    const gradient = ctx.createRadialGradient(
                        x + CELL_SIZE / 2, y + CELL_SIZE / 2, 0,
                        x + CELL_SIZE / 2, y + CELL_SIZE / 2, CELL_SIZE / 2
                    );
                    gradient.addColorStop(0, isHead ? '#88ffaa' : '#00cc66');
                    gradient.addColorStop(1, isHead ? '#00ff88' : '#008844');

                    ctx.fillStyle = gradient;
                    const pad = isHead ? 1 : 3;
                    roundRect(ctx, x + pad, y + pad, CELL_SIZE - pad * 2, CELL_SIZE - pad * 2, 4);
                    ctx.fill();

                    // Ojos en la cabeza
                    if (isHead) {
                        ctx.fillStyle = '#000';
                        ctx.shadowBlur = 0;
                        const eyeOffset = 4;
                        const eyeSize = 3;
                        let ex1 = x + CELL_SIZE / 2 - eyeOffset, ey1 = y + CELL_SIZE / 2 - 2;
                        let ex2 = x + CELL_SIZE / 2 + eyeOffset, ey2 = y + CELL_SIZE / 2 - 2;

                        // Ajustar ojos según dirección
                        if (direction.x === 1) { ex1 += 2; ex2 += 2; }
                        if (direction.x === -1) { ex1 -= 2; ex2 -= 2; }
                        if (direction.y === -1) { ey1 -= 2; ey2 -= 2; }
                        if (direction.y === 1) { ey1 += 2; ey2 += 2; }

                        ctx.beginPath();
                        ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
                        ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                });

                // Partículas
                particles.forEach(p => {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 5;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;

                // Textos flotantes
                floatingTexts.forEach(t => {
                    ctx.globalAlpha = t.life;
                    ctx.fillStyle = t.color;
                    ctx.font = 'bold 14px Orbitron';
                    ctx.textAlign = 'center';
                    ctx.fillText(t.text, t.x, t.y);
                });
                ctx.globalAlpha = 1;

                // Modo fantasma: borde de pantalla
                if (activePowerUps.ghost > 0) {
                    ctx.strokeStyle = 'rgba(170, 102, 255, 0.3)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([10, 10]);
                    ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
                    ctx.setLineDash([]);
                }
            }

            requestAnimationFrame(draw);
        }

        function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
            let rot = Math.PI / 2 * 3;
            let x = cx;
            let y = cy;
            let step = Math.PI / spikes;

            ctx.beginPath();
            ctx.moveTo(cx, cy - outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius;
                y = cy + Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                x = cx + Math.cos(rot) * innerRadius;
                y = cy + Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(cx, cy - outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        function roundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        let frameCount = 0;
        function gameLoop(timestamp) {
            frameCount++;
            update(timestamp);
            // draw se llama por separado para mantener 60fps de renderizado
        }

        // Iniciar bucles
        requestAnimationFrame(update);
        requestAnimationFrame(draw);

        // Inicializar
        resizeCanvas();
    </script>
